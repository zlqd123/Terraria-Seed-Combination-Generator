/* ============================================================

 * ============================================================ */
const EXCLUDED_TEXTS = new Set([
  "I am error",
  "how did I get here",
  "royale with cheese",
  "truck stop",
]);

/* ============================================================
 * 用户勾选排除

const userExcluded = new Set();


/* ============================================================
 * 工具函数
 * ============================================================ */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function hasHardConflict(candidate, picks) {
  for (const pair of CONFLICTS) {
    const a = pair[0], b = pair[1];
    if (candidate.text === a && picks.some(s => s.text === b)) return true;
    if (candidate.text === b && picks.some(s => s.text === a)) return true;
  }
  return false;
}

function hasDomainCollision(candidate, picks) {
  if (!candidate.domain) return false;
  return picks.some(s => s.domain && s.domain === candidate.domain);
}


/* ============================================================
 * 抽取核心
 * ============================================================ */
function pickFrom(cat, sub, n, alreadyPicked) {
  alreadyPicked = alreadyPicked || [];
  if (n <= 0) return [];

  const baseFilter = s => {
    if (s.cat !== cat) return false;
    if (sub && s.sub !== sub) return false;
    if (EXCLUDED_TEXTS.has(s.text)) return false;
    if (hasDomainCollision(s, alreadyPicked)) return false;
    if (hasHardConflict(s, alreadyPicked)) return false;
    return true;
  };

  let pool = SEEDS.filter(s => baseFilter(s) && !userExcluded.has(s.text));
  let ignoredUser = false;

  if (pool.length === 0) {
    pool = SEEDS.filter(baseFilter);
    if (pool.length > 0) ignoredUser = true;
  }

  if (pool.length === 0) {
    pool = SEEDS.filter(s =>
      s.cat === cat &&
      (!sub || s.sub === sub) &&
      !EXCLUDED_TEXTS.has(s.text)
    );
  }

  if (pool.length === 0) return [];

  n = Math.min(n, pool.length);
  for (let i = 0; i < n; i++) {
    const j = randInt(i, pool.length - 1);
    const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }

  const result = pool.slice(0, n);
  if (ignoredUser) result._ignoredUser = true;
  return result;
}


/* ============================================================
 * 按规则生成数量
 * ============================================================ */
function rollCounts() {
  const A = ROLL_RULES.A, B = ROLL_RULES.B, C = ROLL_RULES.C;
  const G = ROLL_RULES.GAMEPLAY, V = ROLL_RULES.VISUAL;
  const GLOBAL = ROLL_RULES.GLOBAL;
  let a, b, c, guard = 0;

  while (true) {
    guard++;
    if (guard > 5000) {
      a = A.min; b = B.min; c = C.min;
      if (a + b + c < GLOBAL.minTotalTerrain) {
        a = Math.min(A.max, Math.max(a, GLOBAL.minTotalTerrain));
      }
      break;
    }
    a = A.allowZero ? randInt(A.min, A.max) : randInt(Math.max(A.min, 1), A.max);
    b = B.allowZero ? randInt(B.min, B.max) : randInt(Math.max(B.min, 1), B.max);
    c = C.allowZero ? randInt(C.min, C.max) : randInt(Math.max(C.min, 1), C.max);

    const total = a + b + c;
    if (total < GLOBAL.minTotalTerrain) continue;
    if (total > GLOBAL.maxTotalTerrain) continue;
    break;
  }

  const gCount = G.allowZero ? randInt(G.min, G.max) : randInt(Math.max(G.min, 1), G.max);
  const vCount = V.allowZero ? randInt(V.min, V.max) : randInt(Math.max(V.min, 1), V.max);

  return { a: a, b: b, c: c, g: gCount, v: vCount };
}


/* ============================================================
 * 主逻辑
 * ============================================================ */
function roll() {
  const counts = rollCounts();
  const picked = [];
  let userFilterIgnored = false;

  const aPicks = pickFrom("terrain", "A", counts.a, picked);
  if (aPicks._ignoredUser) userFilterIgnored = true;
  picked.push.apply(picked, aPicks);

  const bPicks = pickFrom("terrain", "B", counts.b, picked);
  if (bPicks._ignoredUser) userFilterIgnored = true;
  picked.push.apply(picked, bPicks);

  const cPicks = pickFrom("terrain", "C", counts.c, picked);
  if (cPicks._ignoredUser) userFilterIgnored = true;
  picked.push.apply(picked, cPicks);

  const gameplayPicks = pickFrom("gameplay", "", counts.g, picked);
  if (gameplayPicks._ignoredUser) userFilterIgnored = true;
  picked.push.apply(picked, gameplayPicks);

  const visualPicks = pickFrom("visual", "", counts.v, picked);
  if (visualPicks._ignoredUser) userFilterIgnored = true;

  render(
    aPicks.concat(bPicks, cPicks),
    gameplayPicks,
    visualPicks,
    counts,
    userFilterIgnored
  );
}


/* ============================================================
 * 软冲突检测
 * ============================================================ */
function detectSoftConflicts(allPicks) {
  const found = [];
  const texts = allPicks.map(s => s.text);
  for (const pair of SOFT_CONFLICTS) {
    const a = pair[0], b = pair[1], reason = pair[2];
    if (texts.indexOf(a) !== -1 && texts.indexOf(b) !== -1) {
      found.push({ a: a, b: b, reason: reason });
    }
  }
  return found;
}

function seedSoftTags(seed, allPicks) {
  const tags = [];
  const texts = allPicks.map(s => s.text);
  for (const pair of SOFT_CONFLICTS) {
    const a = pair[0], b = pair[1];
    if (seed.text === a && texts.indexOf(b) !== -1) tags.push(b);
    if (seed.text === b && texts.indexOf(a) !== -1) tags.push(a);
  }
  return tags;
}


/* ============================================================
 * 渲染
 * ============================================================ */
function render(terrainPicks, gameplayPicks, visualPicks, counts, userFilterIgnored) {
  const out = document.getElementById("output");
  const allPicks = terrainPicks.concat(gameplayPicks, visualPicks);
  let html = "";

  const softConflicts = detectSoftConflicts(allPicks);
  if (userFilterIgnored) {
    html += '<div class="banner warn">⚠️ 你勾选的排除项过多，导致某一类无可选种子，已自动忽略部分排除以保证能抽出结果。</div>';
  }
  if (softConflicts.length === 0 && !userFilterIgnored) {
    html += '<div class="banner ok">✅ 本组未检测到明显冲突，可放心开图。</div>';
  } else if (softConflicts.length > 0) {
    html += '<div class="banner warn">⚠️ 检测到 ' + softConflicts.length + ' 处潜在冲突/冗余：<br>';
    for (const c of softConflicts) {
      html += '· <b>' + escapeHtml(c.a) + '</b> × <b>' + escapeHtml(c.b) + '</b> —— ' + escapeHtml(c.reason) + '<br>';
    }
    html += '</div>';
  }

  // ---- 地形变化（并排，每行最多 3） ----
  html += '<div class="section-title">【地形变化】</div>';
  if (terrainPicks.length === 0) {
    html += '<div class="empty">本次未抽取地形变化类种子。</div>';
  } else {
    html += '<div class="seed-grid">';
    for (const s of terrainPicks) {
      const softTags = seedSoftTags(s, allPicks);
      const cardClass = softTags.length > 0 ? "seed-card redundant" : "seed-card";
      const tagHtml = softTags.length > 0
        ? '<span class="seed-tag tag-redundant">与 ' + escapeHtml(softTags.join(" / ")) + ' 可能冲突</span>'
        : "";
      html += '<div class="' + cardClass + '">'
           +  '<div class="seed-name">' + escapeHtml(s.name)
           +  ' <span class="seed-sub">' + escapeHtml(s.sub) + ' 类</span>' + tagHtml + '</div>'
           +  '<div><span class="seed-text">' + escapeHtml(s.text) + '</span></div>'
           +  '<div class="seed-desc">' + escapeHtml(s.desc) + '</div>'
           +  '</div>';
    }
    html += '</div>';
  }

  // ---- 玩法影响（并排，每行最多 3） ----
  html += '<div class="section-title">【玩法影响】</div>';
  if (gameplayPicks.length === 0) {
    html += '<div class="empty">本次未抽取玩法影响类种子。</div>';
  } else {
    html += '<div class="seed-grid">';
    for (const s of gameplayPicks) {
      const softTags = seedSoftTags(s, allPicks);
      const cardClass = softTags.length > 0 ? "seed-card gameplay redundant" : "seed-card gameplay";
      const tagHtml = softTags.length > 0
        ? '<span class="seed-tag tag-redundant">与 ' + escapeHtml(softTags.join(" / ")) + ' 可能冲突</span>'
        : "";
      html += '<div class="' + cardClass + '">'
           +  '<div class="seed-name">' + escapeHtml(s.name) + tagHtml + '</div>'
           +  '<div><span class="seed-text">' + escapeHtml(s.text) + '</span></div>'
           +  '<div class="seed-desc">' + escapeHtml(s.desc) + '</div>'
           +  '</div>';
    }
    html += '</div>';
  }

  // ---- 仅外观（如果以后启用） ----
  if (visualPicks.length > 0) {
    html += '<div class="section-title">【仅外观】</div>';
    html += '<div class="seed-grid">';
    for (const s of visualPicks) {
      html += '<div class="seed-card">'
           +  '<div class="seed-name">' + escapeHtml(s.name) + '</div>'
           +  '<div><span class="seed-text">' + escapeHtml(s.text) + '</span></div>'
           +  '<div class="seed-desc">' + escapeHtml(s.desc) + '</div>'
           +  '</div>';
    }
    html += '</div>';
  }

  out.innerHTML = html;
}


/* ============================================================
 * 复选框构建（两个）
 * ============================================================ */
function buildFilters() {
  const groups = [
    { el: "filterTerrain",  cat: "terrain"  },
    { el: "filterGameplay", cat: "gameplay" }
  ];

  for (const g of groups) {
    const box = document.getElementById(g.el);
    if (!box) continue;

    const items = SEEDS
      .filter(s => s.cat === g.cat)
      .filter(s => !EXCLUDED_TEXTS.has(s.text));

    let inner = "";
    for (const s of items) {
      const t = escapeHtml(s.text);
      inner += '<label class="filter-item" data-text="' + t + '">'
            +  '<input type="checkbox" data-text="' + t + '">'
            +  '<span>' + escapeHtml(s.name) + '</span>'
            +  '</label>';
    }
    box.innerHTML = inner;
  }

  document.querySelectorAll('.filter-list').forEach(list => {
    list.removeEventListener('change', onFilterChange);
    list.addEventListener('change', onFilterChange);
  });

  // 两个标题点击：任意一个 → 两个一起展开/折叠
  document.querySelectorAll('.filter-title').forEach(btn => {
    btn.removeEventListener('click', onTitleClick);
    btn.addEventListener('click', onTitleClick);
  });
}

function onFilterChange(e) {
  const cb = e.target;
  if (cb.type !== 'checkbox') return;

  const t = cb.dataset.text;
  const label = cb.closest('.filter-item');

  if (cb.checked) {
    userExcluded.add(t);
    if (label) label.classList.add('checked');
  } else {
    userExcluded.delete(t);
    if (label) label.classList.remove('checked');
  }
}

/* 任意一个标题被点击 → 两个过滤区一起展开或一起折叠 */
function onTitleClick(e) {
  const groups = document.querySelectorAll('#filtersBox .filter-group');
  const anyExpanded = Array.prototype.some.call(groups, g => g.classList.contains('expanded'));
  const targetState = !anyExpanded;
  groups.forEach(g => {
    if (targetState) g.classList.add('expanded');
    else g.classList.remove('expanded');
  });
}


/* ============================================================
 * 规则展示区（放最下面）
 * ============================================================ */
function renderRulesBox() {
  const R = ROLL_RULES;
  const list = document.getElementById("rulesList");
  if (!list) return;
  const items = [
    'A 类（整体结构剧变）：<code>' + R.A.min + ' ~ ' + R.A.max + '</code> 个，允许为 0：<code>' + R.A.allowZero + '</code>',
    'B 类（大片地形替换）：<code>' + R.B.min + ' ~ ' + R.B.max + '</code> 个，允许为 0：<code>' + R.B.allowZero + '</code>',
    'C 类（局部结构增减）：<code>' + R.C.min + ' ~ ' + R.C.max + '</code> 个，允许为 0：<code>' + R.C.allowZero + '</code>',
    '玩法影响：<code>' + R.GAMEPLAY.min + ' ~ ' + R.GAMEPLAY.max + '</code> 个，允许为 0：<code>' + R.GAMEPLAY.allowZero + '</code>',
    '仅外观：<code>' + R.VISUAL.min + ' ~ ' + R.VISUAL.max + '</code> 个，允许为 0：<code>' + R.VISUAL.allowZero + '</code>',
    '地形总数上限（A+B+C）：<code>' + R.GLOBAL.maxTotalTerrain + '</code>',
    '地形总数下限（A+B+C）：<code>' + R.GLOBAL.minTotalTerrain + '</code>'
  ];
  let html = "";
  for (const it of items) html += '<li>' + it + '</li>';
  list.innerHTML = html;
}


/* ============================================================
 * 按钮绑定 + 初始化
 * ============================================================ */
document.getElementById("rollBtn").addEventListener("click", roll);

document.getElementById("clearBtn").addEventListener("click", function () {
  userExcluded.clear();
  const checkboxes = document.querySelectorAll('.filter-item input[type="checkbox"]');
  for (let i = 0; i < checkboxes.length; i++) {
    checkboxes[i].checked = false;
    const label = checkboxes[i].closest('.filter-item');
    if (label) label.classList.remove('checked');
  }
});

// 初始化：构建复选框 → 规则展示 → 自动生成一组
buildFilters();
renderRulesBox();
roll();
</script>
</body>
</html>
